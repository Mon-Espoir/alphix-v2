; ---------------------------------------------------------------------------
; ALPHIX V2 - Limites d'upload PHP (200 Mo)
; ---------------------------------------------------------------------------
; Charge par le serveur de dev via PHP_INI_SCAN_DIR (voir serve.sh).
; Le serveur integre `php artisan serve` ignore backend/public/.user.ini
; (lu uniquement par CGI/FastCGI) : c'est ce fichier qui fait foi en dev.
; En production (PHP-FPM), preferer backend/public/.user.ini ou la conf du pool.
upload_max_filesize = 200M
post_max_size = 210M
max_file_uploads = 20
