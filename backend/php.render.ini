; ALPHIX V2 — PHP production (Render Free : 512 Mo RAM)
; Les documents vont jusqu'à 200 Mo (validation Laravel max:204800) :
; PHP doit accepter des POST aussi gros, sinon 413 silencieux.
; ATTENTION : sur 512 Mo, un memory_limit trop haut provoque un OOM kill
; de l'instance entière (=> 503 global, tout le site tombe, y compris
; le login des étudiants). On reste sous la RAM disponible et on borne
; l'usage mémoire du worker qui traite les uploads.
post_max_size = 256M
upload_max_filesize = 200M
max_input_time = 300
max_execution_time = 300
memory_limit = 384M