# Render Blueprint for ALPHIX V2 (100% gratuit)
# - alphix-backend  : Web Service Laravel (spin-down après 15 min)
# - alphix-frontend : Site statique React (CDN mondial, jamais endormi)
# PostgreSQL : Supabase (hors Render), configuré via les env vars DB_* ci-dessous.
# URLs permanentes :
#   https://alphix-backend.onrender.com  (API)
#   https://alphix-frontend.onrender.com (site)

services:
  # Web Service Laravel (gratuit, spin-down après 15 min inactivité)
  - type: web
    name: alphix-backend
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/Mon-Espoir/alphix-v2
    branch: master
    rootDir: backend
    dockerfilePath: ./Dockerfile.render
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: APP_NAME
        value: ALPHIX
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://alphix-backend.onrender.com
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      # PostgreSQL Supabase. Valeurs réelles saisies dans le dashboard Render
      # (sync: false) pour ne jamais committer d'identifiants dans Git.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      # Réutilise la connexion TLS au pooler entre les requêtes d'un même worker
      # PHP-FPM (le backend Render et la base Supabase sont dans deux régions).
      - key: DB_PERSISTENT
        value: "true"
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      - key: SANCTUM_STATEFUL_DOMAINS
        value: alphix-backend.onrender.com
      # --- Transfert Drive via rclone (ajouts uniquement : sans la conf,
      # l'upload garde son comportement actuel = fallback local) ---
      - key: RCLONE_BINARY
        value: rclone
      - key: RCLONE_REMOTE
        value: mon_drive
      - key: RCLONE_FOLDER
        value: ALPHIX
      # DANGER : rclone lit RCLONE_TIMEOUT comme une durée Go — TOUJOURS
      # avec unité ("300s"), jamais un nombre nu ("300" = erreur CRITICAL).
      - key: RCLONE_TIMEOUT
        value: 300s
      # Contenu du fichier rclone.conf ([mon_drive]) — JAMAIS dans Git :
      # Render demande la valeur à la synchronisation du Blueprint.
      - key: RCLONE_CONFIG_CONTENT
        sync: false
    buildCommand: |
      composer install --no-dev --no-scripts --optimize-autoloader --no-interaction
      php artisan key:generate --force --no-interaction
      php artisan migrate --force --no-interaction
      php artisan storage:link --no-interaction
      php artisan config:cache --no-interaction
      php artisan route:cache --no-interaction
      php artisan view:cache --no-interaction
    healthCheckPath: /api/v1/maintenance/status
    autoDeploy: true

  # Site statique React (gratuit, CDN mondial, ne dort JAMAIS).
  # Le build Vite fige les variables VITE_* ci-dessous dans le JS compilé.
  - type: web
    name: alphix-frontend
    runtime: static
    repo: https://github.com/Mon-Espoir/alphix-v2
    branch: master
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: VITE_API_BASE_URL
        value: https://alphix-backend.onrender.com/api/v1
      - key: VITE_APP_NAME
        value: ALPHIX
      - key: VITE_AUTH_MODE
        value: token
      - key: VITE_API_TIMEOUT_MS
        value: "30000"
    routes:
      # SPA React Router : toutes les pages renvoient index.html
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true