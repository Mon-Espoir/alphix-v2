# Render Blueprint for ALPHIX V2 Backend
# Déploiement 100% gratuit : Web Service + PostgreSQL (90 jours gratuits)
# URL permanente : https://alphix-backend.onrender.com

databases:
  - name: alphix-db
    plan: free
    databaseName: alphix
    user: alphix
    postgresMajorVersion: "16"

services:
  # Web Service Laravel (gratuit, spin-down après 15 min inactivité)
  - type: web
    name: alphix-backend
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/Mon-Espoir/alphix-v2
    branch: master
    rootDir: backend
    dockerfilePath: ./Dockerfile.render
    envVars:
      - key: APP_NAME
        value: ALPHIX
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://alphix-backend.onrender.com
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      # Variables injectées automatiquement depuis la database 'alphix-db' :
      # DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      - key: SANCTUM_STATEFUL_DOMAINS
        value: alphix-backend.onrender.com
    buildCommand: |
      composer install --no-dev --optimize-autoloader --no-interaction
      php artisan key:generate --force --no-interaction
      php artisan migrate --force --no-interaction
      php artisan storage:link --no-interaction
      php artisan config:cache --no-interaction
      php artisan route:cache --no-interaction
      php artisan view:cache --no-interaction
    healthCheckPath: /api/v1/maintenance/status
    autoDeploy: true